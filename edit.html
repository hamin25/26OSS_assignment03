<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 수정</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="my.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">성적 관리</a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">성적 목록</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">성적 추가</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container form-area">

        <h1 class="page-title">성적 수정</h1>

        <form id="editForm">
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="idInput" class="form-label">번호</label>
                    <!-- readonly : 번호(고유 식별자)는 수정할 수 없게 함 -->
                    <input type="number" class="form-control" id="idInput" readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="subjectInput" class="form-label">과목명</label>
                    <input type="text" class="form-control" id="subjectInput" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="professorInput" class="form-label">교수님</label>
                    <input type="text" class="form-control" id="professorInput" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="categoryInput" class="form-label">전공/교양</label>
                    <select class="form-select" id="categoryInput" required>
                        <option value="전공">전공</option>
                        <option value="교양">교양</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="creditInput" class="form-label">학점수</label>
                    <select class="form-select" id="creditInput" required>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="gradeTypeInput" class="form-label">GRADE/PF</label>
                    <select class="form-select" id="gradeTypeInput" required>
                        <option value="GRADE">GRADE</option>
                        <option value="PF">PF</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="semesterInput" class="form-label">수강 학기</label>
                    <select class="form-select" id="semesterInput" required>
                        <option value="2025-1">2025-1</option>
                        <option value="2025-2">2025-2</option>
                        <option value="2026-1">2026-1</option>
                        <option value="2026-2">2026-2</option>
                    </select>
                </div>

            </div>

            <button type="button" class="btn btn-warning" onclick="checkAndEdit()">수정</button>
            <a href="index.html" class="btn btn-secondary">취소</a>

        </form>

    </div>

    <div class="footer">
        © 2026 성적 관리 프로그램 - 웹프로그래밍 과제
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        var defaultGrades = [
            { id: 1, subject: "웹프로그래밍", professor: "홍길동", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" },
            { id: 2, subject: "자료구조",     professor: "김교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-1" },
            { id: 3, subject: "대학영어",     professor: "이교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2026-1" },
            { id: 4, subject: "컴퓨터개론",   professor: "박교수", category: "전공", credit: 3, gradeType: "PF",    semester: "2025-2" },
            { id: 5, subject: "심리학개론",   professor: "최교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2025-2" },
            { id: 6, subject: "데이터베이스", professor: "정교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" }
        ];

        function getGrades() {
            var data = localStorage.getItem("grades");
            if (data === null) {
                saveGrades(defaultGrades);
                return defaultGrades;
            }
            return JSON.parse(data);
        }

        function saveGrades(grades) {
            localStorage.setItem("grades", JSON.stringify(grades));
        }

        function getIdFromUrl() {
            var params = new URLSearchParams(window.location.search);
            return Number(params.get("id"));
        }

        // 기존 데이터를 찾아서 Form에 미리 채워 넣는 함수
        function loadGradeToForm() {
            var id = getIdFromUrl();
            var grades = getGrades();
            var found = null;

            for (var i = 0; i < grades.length; i++) {
                if (grades[i].id === id) {
                    found = grades[i];
                    break;
                }
            }

            if (found === null) {
                alert("해당 과목을 찾을 수 없습니다.");
                location.href = "index.html";
                return;
            }

            document.getElementById("idInput").value = found.id;
            document.getElementById("subjectInput").value = found.subject;
            document.getElementById("professorInput").value = found.professor;
            document.getElementById("categoryInput").value = found.category;
            document.getElementById("creditInput").value = found.credit;
            document.getElementById("gradeTypeInput").value = found.gradeType;
            document.getElementById("semesterInput").value = found.semester;
        }

        function checkAndEdit() {

            var id = Number(document.getElementById("idInput").value);
            var subject = document.getElementById("subjectInput").value;
            var professor = document.getElementById("professorInput").value;
            var category = document.getElementById("categoryInput").value;
            var credit = document.getElementById("creditInput").value;
            var gradeType = document.getElementById("gradeTypeInput").value;
            var semester = document.getElementById("semesterInput").value;

            // Validation 1 : 과목명 필수
            if (subject === "") {
                alert("과목명을 입력해주세요.");
                return;
            }

            // Validation 2 : 교수님 필수
            if (professor === "") {
                alert("교수님 이름을 입력해주세요.");
                return;
            }

            // Validation 3 : 전공/교양 선택 확인
            if (category === "") {
                alert("전공/교양을 선택해주세요.");
                return;
            }

            // Validation 4 : 학점 확인
            if (credit === "") {
                alert("학점수를 선택해주세요.");
                return;
            }

            // Validation 5 : 수강 학기 선택 확인
            if (semester === "") {
                alert("수강 학기를 선택해주세요.");
                return;
            }

            var isOk = confirm("이 과목을 수정할까요?");

            if (isOk) {
                var grades = getGrades();

                // id가 같은 항목을 찾아서 값을 덮어쓴다
                for (var i = 0; i < grades.length; i++) {
                    if (grades[i].id === id) {
                        grades[i].subject = subject;
                        grades[i].professor = professor;
                        grades[i].category = category;
                        grades[i].credit = Number(credit);
                        grades[i].gradeType = gradeType;
                        grades[i].semester = semester;
                        break;
                    }
                }

                saveGrades(grades);

                alert("수정되었습니다.");
                location.href = "view.html?id=" + id;
            }
        }

        loadGradeToForm();

    </script>

</body>
</html>
