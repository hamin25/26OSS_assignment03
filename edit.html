
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 수정</title>

    <!-- Bootstrap 5 CSS 연결 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- 내가 직접 만든 CSS 연결 -->
    <link rel="stylesheet" href="my.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">성적 관리</a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">성적 목록</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">성적 추가</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container form-area">

        <h1 class="page-title">성적 수정</h1>

        <form id="editForm">

            <div class="row">

                <!-- 왼쪽 열 -->
                <div class="col-md-6 mb-3">
                    <label for="idInput" class="form-label">번호</label>
                    <!-- value="1" : 기존 값이 미리 채워져 있다 -->
                    <input type="number" class="form-control" id="idInput" value="1" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="subjectInput" class="form-label">과목명</label>
                    <input type="text" class="form-control" id="subjectInput" value="웹프로그래밍" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="professorInput" class="form-label">교수님</label>
                    <input type="text" class="form-control" id="professorInput" value="홍길동" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="categoryInput" class="form-label">전공/교양</label>
                    <select class="form-select" id="categoryInput" required>
                        <!-- selected : 기존 값이 미리 선택되어 있다 -->
                        <option value="전공" selected>전공</option>
                        <option value="교양">교양</option>
                    </select>
                </div>

                <!-- 오른쪽 열 -->
                <div class="col-md-6 mb-3">
                    <label for="creditInput" class="form-label">학점수</label>
                    <select class="form-select" id="creditInput" required>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="gradeTypeInput" class="form-label">GRADE/PF</label>
                    <select class="form-select" id="gradeTypeInput" required>
                        <option value="GRADE" selected>GRADE</option>
                        <option value="PF">PF</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="semesterInput" class="form-label">수강 학기</label>
                    <select class="form-select" id="semesterInput" required>
                        <option value="2025-1">2025-1</option>
                        <option value="2025-2">2025-2</option>
                        <option value="2026-1">2026-1</option>
                        <option value="2026-2" selected>2026-2</option>
                    </select>
                </div>

            </div>

            <!-- 버튼 영역 -->
            <button type="button" class="btn btn-warning" onclick="checkAndEdit()">수정</button>
            <a href="view.html" class="btn btn-secondary">취소</a>

        </form>

    </div>

    <div class="footer">
        © 2026 성적 관리 프로그램 - 웹프로그래밍 과제
    </div>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript Validation -->
    <script>

        function checkAndEdit() {

            var subject = document.getElementById("subjectInput").value;
            var professor = document.getElementById("professorInput").value;
            var category = document.getElementById("categoryInput").value;
            var credit = document.getElementById("creditInput").value;
            var semester = document.getElementById("semesterInput").value;

            // Validation 1 : 과목명 필수
            if (subject === "") {
                alert("과목명을 입력해주세요.");
                return;
            }

            // Validation 2 : 교수님 필수
            if (professor === "") {
                alert("교수님 이름을 입력해주세요.");
                return;
            }

            // Validation 3 : 전공/교양 선택 확인
            if (category === "") {
                alert("전공/교양을 선택해주세요.");
                return;
            }

            // Validation 4 : 학점 확인
            if (credit === "") {
                alert("학점수를 선택해주세요.");
                return;
            }

            // Validation 5 : 학기 선택 확인
            if (semester === "") {
                alert("수강 학기를 선택해주세요.");
                return;
            }

            // 모든 입력이 정상일 때 확인창을 띄운다
            var isOk = confirm("이 과목을 수정할까요?");

            if (isOk) {
                alert("수정되었습니다.");
                location.href = "view.html";
            }
        }

    </script>

</body>
</html>
