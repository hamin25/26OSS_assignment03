<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 추가</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="my.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">성적 관리</a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">성적 목록</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">성적 추가</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container form-area">

        <h1 class="page-title">성적 추가</h1>

        <form id="addForm">
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="idInput" class="form-label">번호</label>
                    <!-- readonly : 번호는 자동으로 채워지고 사용자가 직접 바꾸지 못하게 함 -->
                    <input type="number" class="form-control" id="idInput" readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="subjectInput" class="form-label">과목명</label>
                    <input type="text" class="form-control" id="subjectInput" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="professorInput" class="form-label">교수님</label>
                    <input type="text" class="form-control" id="professorInput" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="categoryInput" class="form-label">전공/교양</label>
                    <select class="form-select" id="categoryInput" required>
                        <option value="">선택하세요</option>
                        <option value="전공">전공</option>
                        <option value="교양">교양</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="creditInput" class="form-label">학점수</label>
                    <select class="form-select" id="creditInput" required>
                        <option value="">선택하세요</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="gradeTypeInput" class="form-label">GRADE/PF</label>
                    <select class="form-select" id="gradeTypeInput" required>
                        <option value="">선택하세요</option>
                        <option value="GRADE">GRADE</option>
                        <option value="PF">PF</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="semesterInput" class="form-label">수강 학기</label>
                    <select class="form-select" id="semesterInput" required>
                        <option value="">선택하세요</option>
                        <option value="2025-1">2025-1</option>
                        <option value="2025-2">2025-2</option>
                        <option value="2026-1">2026-1</option>
                        <option value="2026-2">2026-2</option>
                    </select>
                </div>

            </div>

            <button type="button" class="btn btn-primary" onclick="checkAndAdd()">추가하기</button>
            <a href="index.html" class="btn btn-secondary">취소</a>

        </form>

    </div>

    <div class="footer">
        © 2026 성적 관리 프로그램 - 웹프로그래밍 과제
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        var defaultGrades = [
            { id: 1, subject: "웹프로그래밍", professor: "홍길동", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" },
            { id: 2, subject: "자료구조",     professor: "김교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-1" },
            { id: 3, subject: "대학영어",     professor: "이교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2026-1" },
            { id: 4, subject: "컴퓨터개론",   professor: "박교수", category: "전공", credit: 3, gradeType: "PF",    semester: "2025-2" },
            { id: 5, subject: "심리학개론",   professor: "최교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2025-2" },
            { id: 6, subject: "데이터베이스", professor: "정교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" }
        ];

        function getGrades() {
            var data = localStorage.getItem("grades");
            if (data === null) {
                saveGrades(defaultGrades);
                return defaultGrades;
            }
            return JSON.parse(data);
        }

        function saveGrades(grades) {
            localStorage.setItem("grades", JSON.stringify(grades));
        }

        // 페이지가 열리면 다음 번호(id)를 자동으로 계산해서 넣어준다
        function setNextId() {
            var grades = getGrades();
            var nextId = 1;

            for (var i = 0; i < grades.length; i++) {
                if (grades[i].id >= nextId) {
                    nextId = grades[i].id + 1;
                }
            }

            document.getElementById("idInput").value = nextId;
        }

        function checkAndAdd() {

            var id = document.getElementById("idInput").value;
            var subject = document.getElementById("subjectInput").value;
            var professor = document.getElementById("professorInput").value;
            var category = document.getElementById("categoryInput").value;
            var credit = document.getElementById("creditInput").value;
            var gradeType = document.getElementById("gradeTypeInput").value;
            var semester = document.getElementById("semesterInput").value;

            // Validation 1 : 과목명이 비어 있는지 확인
            if (subject === "") {
                alert("과목명을 입력해주세요.");
                return;
            }

            // Validation 2 : 교수님이 비어 있는지 확인
            if (professor === "") {
                alert("교수님 이름을 입력해주세요.");
                return;
            }

            // Validation 3 : 전공/교양이 선택되었는지 확인
            if (category === "") {
                alert("전공/교양을 선택해주세요.");
                return;
            }

            // Validation 4 : 학점이 선택되었는지 확인
            if (credit === "") {
                alert("학점수를 선택해주세요.");
                return;
            }

            // Validation 5 : GRADE/PF가 선택되었는지 확인
            if (gradeType === "") {
                alert("GRADE/PF를 선택해주세요.");
                return;
            }

            // Validation 6 : 수강 학기가 선택되었는지 확인
            if (semester === "") {
                alert("수강 학기를 선택해주세요.");
                return;
            }

            var isOk = confirm("과목이 추가됩니다.");

            if (isOk) {
                var grades = getGrades();

                var newGrade = {
                    id: Number(id),
                    subject: subject,
                    professor: professor,
                    category: category,
                    credit: Number(credit),
                    gradeType: gradeType,
                    semester: semester
                };

                grades.push(newGrade);
                saveGrades(grades);

                alert("과목이 추가되었습니다.");
                location.href = "index.html";
            }
        }

        setNextId();

    </script>

</body>
</html>
