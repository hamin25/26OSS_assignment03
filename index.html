    <div class="container">

        <h1 class="page-title">성적 관리 프로그램</h1>
        <p class="page-description">수강 과목과 성적을 한눈에 관리하세요.</p>

        <a href="add.html" class="btn btn-primary mb-3">+ 과목 추가</a>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>번호</th>
                        <th>과목명</th>
                        <th>교수님</th>
                        <th>전공·교양</th>
                        <th>학점</th>
                        <th>GRADE·PF</th>
                        <th>학기</th>
                    </tr>
                </thead>
                <!-- 표 내용은 JavaScript가 채워준다. 처음에는 비어있다. -->
                <tbody id="gradeTableBody">
                </tbody>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        // localStorage에 데이터가 하나도 없을 때 사용할 기본 예시 데이터
        var defaultGrades = [
            { id: 1, subject: "웹프로그래밍", professor: "홍길동", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" },
            { id: 2, subject: "자료구조", professor: "김교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-1" },
            { id: 3, subject: "대학영어", professor: "이교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2026-1" },
            { id: 4, subject: "컴퓨터개론", professor: "박교수", category: "전공", credit: 3, gradeType: "PF", semester: "2025-2" },
            { id: 5, subject: "심리학개론", professor: "최교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2025-2" },
            { id: 6, subject: "데이터베이스", professor: "정교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" }
        ];

        // localStorage에서 성적 데이터를 가져오는 함수
        function getGrades() {
            var data = localStorage.getItem("grades");

            // 저장된 데이터가 없으면 기본 데이터를 저장하고 반환한다
            if (data === null) {
                saveGrades(defaultGrades);
                return defaultGrades;
            }

            // JSON 문자열을 다시 배열로 바꿔서 반환한다
            return JSON.parse(data);
        }

        // 배열을 localStorage에 저장하는 함수
        function saveGrades(grades) {
            localStorage.setItem("grades", JSON.stringify(grades));
        }

        // 화면에 표를 그리는 함수
        function showGradeList() {
            var grades = getGrades();
            var tbody = document.getElementById("gradeTableBody");

            var html = "";

            for (var i = 0; i < grades.length; i++) {
                var g = grades[i];

                html += "<tr>";
                html += "<td>" + g.id + "</td>";
                html += "<td><a href='view.html?id=" + g.id + "'>" + g.subject + "</a></td>";
                html += "<td>" + g.professor + "</td>";
                html += "<td>" + g.category + "</td>";
                html += "<td>" + g.credit + "</td>";
                html += "<td>" + g.gradeType + "</td>";
                html += "<td>" + g.semester + "</td>";
                html += "</tr>";
            }

            tbody.innerHTML = html;
        }

        // 페이지가 열리면 바로 표를 그린다
        showGradeList();

    </script>
