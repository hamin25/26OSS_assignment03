
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 상세 정보</title>

    <!-- Bootstrap 5 CSS 연결 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- 내가 직접 만든 CSS 연결 -->
    <link rel="stylesheet" href="my.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">성적 관리</a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">성적 목록</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">성적 추가</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

        <h1 class="page-title">성적 상세 정보</h1>

        <!-- ================================
             Bootstrap Card : 하나의 정보 묶음을 보여줄 때 사용하는 박스
        ================================= -->
        <div class="card">

            <!-- 카드 제목 부분 -->
            <div class="card-header">
                웹프로그래밍
            </div>

            <!-- 카드 내용 부분 -->
            <div class="card-body">

                <!-- 7개의 Field를 모두 표시 -->
                <p><strong>번호:</strong> 1</p>
                <p><strong>과목명:</strong> 웹프로그래밍</p>
                <p><strong>교수님:</strong> 홍길동</p>
                <p><strong>전공/교양:</strong> 전공</p>
                <p><strong>학점수:</strong> 3</p>
                <p><strong>GRADE/PF:</strong> GRADE</p>
                <p><strong>수강 학기:</strong> 2026-2</p>

                <!-- 버튼 영역 -->
                <a href="edit.html" class="btn btn-warning">수정</a>
                <button type="button" class="btn btn-danger" onclick="deleteGrade()">삭제</button>
                <a href="index.html" class="btn btn-secondary">목록으로</a>

            </div>
        </div>

    </div>

    <div class="footer">
        © 2026 성적 관리 프로그램 - 웹프로그래밍 과제
    </div>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript : 삭제 버튼 동작 -->
    <script>

        function deleteGrade() {

            // confirm() : 사용자에게 확인을 받는 창
            var isOk = confirm("이 과목을 삭제하시겠습니까?");

            // 사용자가 확인을 눌렀을 때만 실행
            if (isOk) {
                alert("삭제되었습니다.");
                location.href = "index.html";
            }
        }

    </script>

</body>
</html>
