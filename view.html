<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 상세 정보</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="my.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">성적 관리</a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">성적 목록</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">성적 추가</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

        <h1 class="page-title">성적 상세 정보</h1>

        <div class="card">

            <!-- 과목명은 JavaScript가 채워준다 -->
            <div class="card-header" id="cardTitle"></div>

            <div class="card-body">

                <p><strong>번호:</strong> <span id="idText"></span></p>
                <p><strong>과목명:</strong> <span id="subjectText"></span></p>
                <p><strong>교수님:</strong> <span id="professorText"></span></p>
                <p><strong>전공/교양:</strong> <span id="categoryText"></span></p>
                <p><strong>학점수:</strong> <span id="creditText"></span></p>
                <p><strong>GRADE/PF:</strong> <span id="gradeTypeText"></span></p>
                <p><strong>수강 학기:</strong> <span id="semesterText"></span></p>

                <!-- 수정 버튼은 id에 맞는 edit.html 주소로 JavaScript가 연결해준다 -->
                <a href="#" id="editLink" class="btn btn-warning">수정</a>
                <button type="button" class="btn btn-danger" onclick="deleteGrade()">삭제</button>
                <a href="index.html" class="btn btn-secondary">목록으로</a>

            </div>
        </div>

    </div>

    <div class="footer">
        © 2026 성적 관리 프로그램 - 웹프로그래밍 과제
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        var defaultGrades = [
            { id: 1, subject: "웹프로그래밍", professor: "홍길동", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" },
            { id: 2, subject: "자료구조",     professor: "김교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-1" },
            { id: 3, subject: "대학영어",     professor: "이교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2026-1" },
            { id: 4, subject: "컴퓨터개론",   professor: "박교수", category: "전공", credit: 3, gradeType: "PF",    semester: "2025-2" },
            { id: 5, subject: "심리학개론",   professor: "최교수", category: "교양", credit: 2, gradeType: "GRADE", semester: "2025-2" },
            { id: 6, subject: "데이터베이스", professor: "정교수", category: "전공", credit: 3, gradeType: "GRADE", semester: "2026-2" }
        ];

        function getGrades() {
            var data = localStorage.getItem("grades");
            if (data === null) {
                saveGrades(defaultGrades);
                return defaultGrades;
            }
            return JSON.parse(data);
        }

        function saveGrades(grades) {
            localStorage.setItem("grades", JSON.stringify(grades));
        }

        // 주소 뒤에 붙은 ?id=숫자 값을 읽어오는 함수
        function getIdFromUrl() {
            var params = new URLSearchParams(window.location.search);
            return Number(params.get("id"));
        }

        // 화면에 상세 정보를 채워 넣는 함수
        function showGradeDetail() {
            var id = getIdFromUrl();
            var grades = getGrades();
            var found = null;

            for (var i = 0; i < grades.length; i++) {
                if (grades[i].id === id) {
                    found = grades[i];
                    break;
                }
            }

            // 해당 id의 데이터를 찾지 못한 경우
            if (found === null) {
                alert("해당 과목을 찾을 수 없습니다.");
                location.href = "index.html";
                return;
            }

            document.getElementById("cardTitle").innerText = found.subject;
            document.getElementById("idText").innerText = found.id;
            document.getElementById("subjectText").innerText = found.subject;
            document.getElementById("professorText").innerText = found.professor;
            document.getElementById("categoryText").innerText = found.category;
            document.getElementById("creditText").innerText = found.credit;
            document.getElementById("gradeTypeText").innerText = found.gradeType;
            document.getElementById("semesterText").innerText = found.semester;

            // 수정 버튼이 이 과목의 edit 페이지로 가도록 주소를 연결
            document.getElementById("editLink").href = "edit.html?id=" + found.id;
        }

        function deleteGrade() {
            var isOk = confirm("이 과목을 삭제하시겠습니까?");

            if (isOk) {
                var id = getIdFromUrl();
                var grades = getGrades();
                var newGrades = [];

                // 삭제할 id와 다른 것들만 새 배열에 담는다
                for (var i = 0; i < grades.length; i++) {
                    if (grades[i].id !== id) {
                        newGrades.push(grades[i]);
                    }
                }

                saveGrades(newGrades);

                alert("삭제되었습니다.");
                location.href = "index.html";
            }
        }

        showGradeDetail();

    </script>

</body>
</html>
